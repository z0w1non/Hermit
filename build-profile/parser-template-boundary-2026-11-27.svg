  <g stroke="#c8d0d7" stroke-width="1"><line x1="380" y1="90" x2="380" y2="322"/><line x1="515" y1="90" x2="515" y2="322"/><line x1="650" y1="90" x2="650" y2="322"/><line x1="785" y1="90" x2="785" y2="322"/></g>
