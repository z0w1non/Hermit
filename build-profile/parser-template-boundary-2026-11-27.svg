<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Parser translation unit frontend time before and after boundary split</title>
  <desc id="desc">C1xx frontend seconds: parser 37.03 before and 19.04 after; visitors 17.32 before and 13.27 after; combined 54.34 before and 32.31 after.</desc>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b}.title{font-size:22px;font-weight:600}.label{font-size:15px}.small{font-size:13px}.axis{stroke:#8b98a5;stroke-width:1}.before{fill:#9aa9b5}.after{fill:#277da1}</style>
  <text x="36" y="38" class="title">Parser template boundary: c1xx frontend time</text>
  <text x="36" y="64" class="small">Release x64, VS18, /t:Rebuild /m:1, _CL_=/Bt+ · seconds</text>
